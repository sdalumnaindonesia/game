<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan IPAS: Organ Pernapasan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #a7f3d0; /* Hijau mint lembut */
            background-image: 
                radial-gradient(white 15%, transparent 16%),
                radial-gradient(white 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            overflow-x: hidden;
        }

        /* Gaya tombol timbul / pop-out */
        .btn-pop {
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
            transition: all 0.1s;
        }
        .btn-pop:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
        }

        /* Animasi saat jawaban salah */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Animasi saat jawaban benar */
        @keyframes bounce-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .bounce-scale {
            animation: bounce-scale 0.5s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="game-container" class="max-w-2xl w-full bg-white rounded-[2rem] p-6 md:p-10 shadow-2xl border-4 border-emerald-400 relative">
        
        <!-- Layar Mulai -->
        <div id="start-screen" class="flex flex-col items-center text-center">
            <h1 class="text-4xl md:text-5xl font-black text-emerald-600 mb-4 drop-shadow-sm leading-tight">
                Petualangan IPAS:<br> <span class="text-teal-400">Organ Pernapasan</span> 🫁
            </h1>
            <div class="text-6xl mb-6">🌬️</div>
            <p class="text-gray-600 mb-8 text-lg font-bold">Yuk, belajar tentang bagaimana tubuh kita bernapas! Jawab pertanyaannya dengan benar ya!</p>
            <button onclick="startGame()" class="btn-pop w-full md:w-2/3 bg-amber-400 hover:bg-amber-500 text-white text-2xl font-black py-4 px-6 rounded-2xl border-4 border-amber-500">
                MULAI PETUALANGAN 🚀
            </button>
        </div>

        <!-- Layar Kuis (Awalnya Disembunyikan) -->
        <div id="play-screen" class="hidden flex-col items-center w-full">
            
            <div class="flex justify-between w-full mb-6 items-center">
                <div class="bg-emerald-100 text-emerald-700 px-4 py-2 rounded-xl font-bold text-lg border-2 border-emerald-300">
                    Soal: <span id="question-number">1</span>/<span id="total-questions">5</span>
                </div>
                <div class="bg-amber-100 text-amber-600 px-4 py-2 rounded-xl font-bold text-lg border-2 border-amber-300">
                    ⭐ Skor: <span id="score">0</span>
                </div>
            </div>

            <!-- Pertanyaan -->
            <div id="question-box" class="bg-teal-500 w-full rounded-2xl p-6 mb-6 shadow-inner text-white min-h-[120px] flex items-center justify-center text-center">
                <h2 id="question-text" class="text-2xl md:text-3xl font-bold">
                    Memuat pertanyaan...
                </h2>
            </div>

            <!-- Pesan Balasan -->
            <div id="feedback-message" class="h-8 text-xl font-bold mb-4 opacity-0 transition-opacity duration-300 text-center w-full">
                Pesan
            </div>

            <!-- Pilihan Jawaban -->
            <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
                <!-- Tombol pilihan akan dimuat di sini oleh JS -->
            </div>
        </div>

        <!-- Layar Akhir -->
        <div id="end-screen" class="hidden flex-col items-center text-center">
            <h2 class="text-4xl font-black text-emerald-600 mb-4">Permainan Selesai! 🎉</h2>
            <div class="text-6xl mb-6">🏆</div>
            <p class="text-2xl text-gray-700 font-bold mb-2">Skor Akhir Kamu:</p>
            <p id="final-score" class="text-6xl font-black text-amber-500 mb-8 drop-shadow-md">0</p>
            <p id="final-message" class="text-lg text-gray-600 font-bold mb-8"></p>
            
            <button onclick="resetGame()" class="btn-pop w-full md:w-2/3 bg-teal-400 hover:bg-teal-500 text-white text-2xl font-black py-4 px-6 rounded-2xl border-4 border-teal-500">
                MAIN LAGI 🔄
            </button>
        </div>

    </div>

    <script>
        // Data Pertanyaan IPAS Kelas SD
        const quizData = [
            {
                question: "Udara pertama kali masuk ke tubuh kita melalui organ apa? 👃",
                options: ["Tenggorokan", "Hidung", "Jantung", "Lambung"],
                correctAnswer: "Hidung"
            },
            {
                question: "Di dalam hidung, terdapat rambut-rambut halus. Apa fungsi rambut halus tersebut? 🧹",
                options: ["Menghasilkan suara", "Mendinginkan udara", "Menyaring debu dan kotoran", "Membantu menelan makanan"],
                correctAnswer: "Menyaring debu dan kotoran"
            },
            {
                question: "Saluran seperti pipa yang menghubungkan hidung dengan paru-paru disebut... 🚰",
                options: ["Trakea (Tenggorokan)", "Kerongkongan", "Bronkus", "Alveolus"],
                correctAnswer: "Trakea (Tenggorokan)"
            },
            {
                question: "Tenggorokan bercabang menjadi dua menuju paru-paru kanan dan kiri. Cabang ini disebut... 🌿",
                options: ["Alveolus", "Diafragma", "Bronkiolus", "Bronkus"],
                correctAnswer: "Bronkus"
            },
            {
                question: "Di manakah tempat terjadinya pertukaran antara oksigen (O2) dan karbon dioksida (CO2)? 🔄",
                options: ["Hidung", "Alveolus", "Trakea", "Bronkus"],
                correctAnswer: "Alveolus"
            },
            {
                question: "Otot penyekat rongga dada dan perut yang sangat membantu kita saat bernapas disebut... 💪",
                options: ["Otot lurik", "Jantung", "Diafragma", "Paru-paru"],
                correctAnswer: "Diafragma"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let audioCtx;
        let isProcessing = false;

        // Warna untuk tombol pilihan
        const colorPalette = [
            'bg-rose-400 border-rose-500 hover:bg-rose-500', 
            'bg-blue-400 border-blue-500 hover:bg-blue-500', 
            'bg-purple-400 border-purple-500 hover:bg-purple-500', 
            'bg-orange-400 border-orange-500 hover:bg-orange-500'
        ];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                // Suara "Ting-Ting" (Berhasil)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                // Suara "Buzzer" (Salah)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        function startGame() {
            initAudio(); // Initialize audio context on first user gesture
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            
            const playScreen = document.getElementById('play-screen');
            playScreen.classList.remove('hidden');
            playScreen.classList.add('flex');
            
            score = 0;
            currentQuestionIndex = 0;
            document.getElementById('total-questions').innerText = quizData.length;
            updateUI();
            loadQuestion();
        }

        function loadQuestion() {
            const currentQuiz = quizData[currentQuestionIndex];
            
            // Set Pertanyaan
            document.getElementById('question-text').innerText = currentQuiz.question;
            document.getElementById('question-number').innerText = currentQuestionIndex + 1;
            
            // Acak pilihan jawaban
            let options = [...currentQuiz.options];
            options.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('options-grid');
            grid.innerHTML = ''; // Kosongkan grid

            // Buat tombol untuk setiap pilihan
            options.forEach((opt, index) => {
                const button = document.createElement('button');
                const colorClass = colorPalette[index % colorPalette.length];
                
                button.className = `btn-pop ${colorClass} text-white font-bold text-lg md:text-xl py-4 px-4 rounded-xl border-b-4 h-full flex items-center justify-center text-center`;
                button.innerText = opt;
                button.onclick = () => checkAnswer(opt, currentQuiz.correctAnswer, button);
                grid.appendChild(button);
            });

            // Reset UI State
            const qBox = document.getElementById('question-box');
            qBox.classList.remove('shake', 'bounce-scale');
            document.getElementById('feedback-message').style.opacity = '0';
        }

        function checkAnswer(selected, correct, buttonElement) {
            if (isProcessing) return;
            isProcessing = true;

            const qBox = document.getElementById('question-box');
            const feedback = document.getElementById('feedback-message');

            if (selected === correct) {
                // Jawaban Benar
                playSound('correct');
                score += 20; // 20 poin per soal
                updateUI();
                
                qBox.classList.add('bounce-scale');
                buttonElement.classList.replace(buttonElement.classList[1], 'bg-emerald-500'); // Ganti warna sesaat
                
                feedback.innerText = "Wah, Hebat! Benar sekali! ✨";
                feedback.className = "h-8 text-xl font-black mb-4 text-emerald-500 transition-opacity duration-300 w-full text-center";
                feedback.style.opacity = '1';

                setTimeout(() => {
                    nextQuestion();
                }, 1500);

            } else {
                // Jawaban Salah
                playSound('wrong');
                
                qBox.classList.add('shake');
                buttonElement.classList.replace(buttonElement.classList[1], 'bg-gray-400');
                
                feedback.innerText = "Yah, masih kurang tepat. Coba lagi! 💪";
                feedback.className = "h-8 text-xl font-black mb-4 text-rose-500 transition-opacity duration-300 w-full text-center";
                feedback.style.opacity = '1';

                setTimeout(() => {
                    qBox.classList.remove('shake');
                    isProcessing = false;
                }, 800);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                isProcessing = false;
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
        }

        function showEndScreen() {
            document.getElementById('play-screen').classList.remove('flex');
            document.getElementById('play-screen').classList.add('hidden');
            
            const endScreen = document.getElementById('end-screen');
            endScreen.classList.remove('hidden');
            endScreen.classList.add('flex');
            
            document.getElementById('final-score').innerText = score;
            
            const message = document.getElementById('final-message');
            if (score === quizData.length * 20) {
                message.innerText = "Sempurna! Kamu adalah ahli pernapasan! 🌟";
            } else if (score >= (quizData.length * 20) / 2) {
                message.innerText = "Bagus sekali! Kamu belajar dengan baik! 👍";
            } else {
                message.innerText = "Tetap semangat belajar ya! Kamu pasti bisa! 📚";
            }
            isProcessing = false;
        }

        function resetGame() {
            startGame();
        }
    </script>
</body>
</html>
