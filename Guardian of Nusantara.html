<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian of Nusantara - Full Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #1a1a2e;
            --text-main: #ffffff;
            --theme-primary: #4ade80;
            --theme-secondary: #000000;
            --panel-bg: rgba(0, 0, 0, 0.8);
            --border-color: #ffffff;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        /* --- THEMES --- */
        /* ZONA 1: Hutan */
        body.theme-z1 { --bg-main: #064e3b; --theme-primary: #4ade80; --border-color: #22c55e; --panel-bg: rgba(6, 78, 59, 0.9); }
        /* ZONA 2: Kota Sirkuit */
        body.theme-z2 { --bg-main: #0b0f19; --theme-primary: #00f3ff; --border-color: #00f3ff; --panel-bg: rgba(17, 24, 39, 0.9); }
        /* ZONA 3: Labirin Kemerdekaan */
        body.theme-z3 { --bg-main: #2c1b18; --theme-primary: #d4af37; --border-color: #d4af37; --panel-bg: rgba(44, 27, 24, 0.9); }
        /* ZONA 4: Observatorium Astral */
        body.theme-z4 { --bg-main: #1e1b4b; --theme-primary: #c084fc; --border-color: #a855f7; --panel-bg: rgba(30, 27, 75, 0.9); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--theme-primary); border-radius: 4px; }

        .game-container {
            background-color: var(--panel-bg);
            border: 4px solid var(--border-color);
            box-shadow: 0 0 20px var(--border-color);
            transition: all 0.5s ease;
        }

        .panel {
            background-color: rgba(0,0,0,0.4);
            border: 2px solid var(--border-color);
            border-radius: 4px;
        }

        /* HP Bar Styling */
        .hp-bar-container {
            width: 100%; height: 16px;
            background-color: #333;
            border: 2px solid #fff;
            border-radius: 2px;
            position: relative;
        }
        .hp-fill { height: 100%; transition: width 0.3s ease-in-out; }
        .hp-player { background-color: #4ade80; }
        .hp-enemy { background-color: #ef4444; }

        /* Buttons */
        .btn-game {
            background-color: rgba(0,0,0,0.6);
            border: 2px solid var(--border-color);
            color: var(--theme-primary);
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-game:hover:not(:disabled) {
            background-color: var(--theme-primary);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--theme-primary);
        }
        .btn-game:disabled {
            opacity: 0.5; cursor: not-allowed; border-color: #555; color: #777;
        }

        /* Map Nodes */
        .map-node {
            border: 4px solid #555;
            background-color: #222;
            color: #777;
            transition: all 0.3s;
        }
        .map-node.unlocked {
            border-color: var(--theme-primary);
            color: white;
            cursor: pointer;
            box-shadow: 0 0 10px var(--theme-primary);
        }
        .map-node.unlocked:hover {
            transform: scale(1.05);
            background-color: var(--theme-primary);
            color: #000;
        }
        .map-node.completed {
            border-color: #fbbf24; /* Gold */
            box-shadow: 0 0 10px #fbbf24;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(3px, 2px) rotate(0deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(3px, -1px) rotate(1deg); }
        }
        .shake-anim { animation: shake 0.4s; filter: brightness(1.5) drop-shadow(0 0 15px red); }

        @keyframes attack-player {
            0%, 100% { transform: translateX(0) scale(1); }
            50% { transform: translateX(50px) scale(1.1); filter: brightness(1.5); }
        }
        .attack-player-anim { animation: attack-player 0.3s ease-in-out; }

        @keyframes attack-enemy {
            0%, 100% { transform: translateX(0) scale(1); }
            50% { transform: translateX(-50px) scale(1.1); filter: brightness(1.5); }
        }
        .attack-enemy-anim { animation: attack-enemy 0.3s ease-in-out; }

        .correct-btn { background-color: #4ade80 !important; color: #000 !important; }
        .wrong-btn { background-color: #ef4444 !important; color: #fff !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

    <div class="game-container w-full max-w-4xl rounded-xl p-4 md:p-6 flex flex-col gap-4 relative min-h-[600px]">
        
        <!-- HEADER -->
        <header class="text-center py-2 border-b-2 border-dashed border-gray-500 mb-4">
            <h1 class="text-xl md:text-3xl text-white drop-shadow-md leading-loose">GUARDIAN OF NUSANTARA</h1>
            <p id="header-subtitle" class="text-[10px] md:text-xs text-gray-400 mt-2">Selamat Datang di Portal Edukasi</p>
        </header>

        <!-- SCREEN: MAIN MENU -->
        <div id="screen-menu" class="flex-1 flex flex-col items-center justify-center gap-6">
            <div class="text-center mb-8">
                <svg class="w-24 h-24 mx-auto text-yellow-400 mb-4 animate-pulse" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12,2L22,8V16L12,22L2,16V8L12,2M12,4.2L4,9V15L12,19.8L20,15V9L12,4.2Z" />
                </svg>
                <p class="text-sm md:text-base leading-loose text-gray-300 max-w-md mx-auto">Kristal Pengetahuan telah pecah! Jelajahi dimensi, kalahkan monster ketidaktahuan, dan selamatkan dunia!</p>
            </div>
            <button onclick="showScreen('screen-map')" class="btn-game px-6 py-4 text-sm md:text-base w-64 rounded">Mulai Petualangan</button>
            <button onclick="alert('Kembali ke Dashboard Sekolah (Simulasi)')" class="btn-game px-6 py-4 text-sm md:text-base w-64 rounded border-gray-500 text-gray-400">Kembali ke Portal</button>
            <button onclick="resetProgress()" class="text-[8px] text-red-500 mt-8 underline">Reset Progres (Dev)</button>
        </div>

        <!-- SCREEN: ZONE MAP -->
        <div id="screen-map" class="hidden flex-1 flex flex-col items-center">
            <h2 class="text-lg md:text-xl text-white mb-6">Pilih Zona Dimensi</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl" id="map-container">
                <!-- Zona di-generate via JS -->
            </div>

            <button onclick="showScreen('screen-menu')" class="mt-8 text-[10px] text-gray-400 hover:text-white underline">Kembali ke Menu Utama</button>
        </div>

        <!-- SCREEN: BATTLE ARENA -->
        <div id="screen-battle" class="hidden flex-1 flex flex-col gap-4">
            <!-- Combat Area -->
            <div class="panel p-4 flex justify-between items-end min-h-[220px] relative">
                <!-- Player -->
                <div class="flex flex-col items-center w-5/12 z-10">
                    <svg id="sprite-player" class="w-20 h-20 md:w-24 md:h-24 mb-4 text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12,2L3,5V11C3,16.5 6.8,21.7 12,23C17.2,21.7 21,16.5 21,11V5L12,2M12,4.3L19,6.5V11C19,15.3 16.1,19.4 12,20.8C7.9,19.4 5,15.3 5,11V6.5L12,4.3M11,7V13H13V7H11M11,15V17H13V15H11Z" />
                    </svg>
                    <div class="w-full">
                        <div class="flex justify-between text-[8px] md:text-[10px] mb-1">
                            <span>Siswa Jagoan</span>
                            <span id="ui-player-hp-txt">100/100</span>
                        </div>
                        <div class="hp-bar-container"><div id="ui-player-hp-fill" class="hp-fill hp-player" style="width: 100%;"></div></div>
                    </div>
                </div>

                <!-- VS Badge -->
                <div class="absolute inset-0 flex items-center justify-center opacity-50 pointer-events-none">
                    <span class="text-2xl md:text-4xl text-white">VS</span>
                </div>

                <!-- Enemy -->
                <div class="flex flex-col items-center w-5/12 z-10">
                    <!-- Enemy Sprite (Path updated dynamically) -->
                    <svg id="sprite-enemy" class="w-20 h-20 md:w-24 md:h-24 mb-4 drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]" fill="currentColor" viewBox="0 0 24 24">
                        <path id="sprite-enemy-path" d="" />
                    </svg>
                    <div class="w-full">
                        <div class="flex justify-between text-[8px] md:text-[10px] mb-1">
                            <span id="ui-enemy-name">Boss</span>
                            <span id="ui-enemy-hp-txt">100/100</span>
                        </div>
                        <div class="hp-bar-container"><div id="ui-enemy-hp-fill" class="hp-fill hp-enemy" style="width: 100%;"></div></div>
                    </div>
                </div>
            </div>

            <!-- Battle Log -->
            <div class="panel p-3 text-center text-[10px] md:text-xs text-white min-h-[40px] flex items-center justify-center" id="ui-log">
                Pertarungan Dimulai!
            </div>

            <!-- Quiz Panel -->
            <div class="panel p-4 flex flex-col gap-4">
                <div id="ui-question" class="text-xs md:text-sm leading-loose text-white min-h-[60px]">
                    Memuat sistem...
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <button class="btn-game text-[9px] md:text-[10px] p-3 rounded" onclick="handleAnswer(0)" id="btn-opt-0">Opsi 1</button>
                    <button class="btn-game text-[9px] md:text-[10px] p-3 rounded" onclick="handleAnswer(1)" id="btn-opt-1">Opsi 2</button>
                    <button class="btn-game text-[9px] md:text-[10px] p-3 rounded" onclick="handleAnswer(2)" id="btn-opt-2">Opsi 3</button>
                    <button class="btn-game text-[9px] md:text-[10px] p-3 rounded" onclick="handleAnswer(3)" id="btn-opt-3">Opsi 4</button>
                </div>
            </div>
        </div>

        <!-- SCREEN: RESULT -->
        <div id="screen-result" class="hidden flex-1 flex flex-col items-center justify-center text-center p-6 panel">
            <h2 id="result-title" class="text-2xl md:text-4xl mb-6">HASIL</h2>
            <p id="result-msg" class="text-xs md:text-sm mb-10 leading-loose text-gray-300 max-w-lg">Pesan hasil...</p>
            <div class="flex flex-col sm:flex-row gap-4" id="result-buttons">
                <!-- Buttons injected via JS -->
            </div>
        </div>

    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // --- GAME DATA & CONFIG ---
        const ZONES = [
            {
                id: 1,
                name: "Zona 1: Hutan Adaptasi",
                themeClass: "theme-z1",
                bossName: "Monster Predator",
                enemySprite: "M12,2C6.48,2 2,6.48 2,12C2,17.52 6.48,22 12,22C17.52,22 22,17.52 22,12C22,6.48 17.52,2 12,2M11,19.93C7.05,19.43 4,16.05 4,12C4,7.95 7.05,4.57 11,4.07V19.93M13,4.07C16.95,4.57 20,7.95 20,12C20,16.05 16.95,19.43 13,19.93V4.07M15,10V14H17V10H15M7,10V14H9V10H7Z",
                enemyColor: "#4ade80",
                maxPlayerHp: 100, maxEnemyHp: 100,
                dmgPlayer: 25, dmgEnemy: 25, // 4 hits to win/lose
                questions: [
                    { q: "Kemampuan bunglon mengubah warna kulit sesuai lingkungan disebut...", options: ["Ekolokasi", "Mimikri", "Kamuflase", "Autotomi"], correct: 1 },
                    { q: "Tumbuhan kaktus memiliki daun berbentuk duri dengan tujuan...", options: ["Menyerap banyak air", "Mengurangi penguapan", "Melindungi dari cuaca dingin", "Mempercepat fotosintesis"], correct: 1 },
                    { q: "Teratai memiliki daun yang lebar dan tipis untuk...", options: ["Mengapung dan mempercepat penguapan", "Menyimpan cadangan air", "Melindungi akar", "Mencegah dimakan ikan"], correct: 0 },
                    { q: "Hewan kelelawar menggunakan sistem sonar/pantulan bunyi untuk bernavigasi yang disebut...", options: ["Mimikri", "Autotomi", "Ekolokasi", "Adaptasi"], correct: 2 },
                    { q: "Bentuk paruh burung elang yang tajam dan bengkok berfungsi untuk...", options: ["Memecah biji", "Mengisap nektar", "Menangkap ikan", "Mencabik daging mangsa"], correct: 3 }
                ]
            },
            {
                id: 2,
                name: "Zona 2: Kota Sirkuit",
                themeClass: "theme-z2",
                bossName: "Robot Korslet",
                enemySprite: "M12,2A2,2 0 0,1 14,4C14,4.74 13.6,5.39 13,5.73V7H14A7,7 0 0,1 21,14H22.5L21,17H3L1.5,14H3A7,7 0 0,1 10,7H11V5.73C10.4,5.39 10,4.74 10,4A2,2 0 0,1 12,2M10,16L12,19L14,16H10M8,11A2,2 0 0,0 6,13A2,2 0 0,0 8,15A2,2 0 0,0 10,13A2,2 0 0,0 8,11M16,11A2,2 0 0,0 14,13A2,2 0 0,0 16,15A2,2 0 0,0 18,13A2,2 0 0,0 16,11Z",
                enemyColor: "#00f3ff",
                maxPlayerHp: 150, maxEnemyHp: 150,
                dmgPlayer: 30, dmgEnemy: 30, // 5 hits
                questions: [
                    { q: "Rangkaian listrik yang disusun berurutan tanpa cabang disebut rangkaian...", options: ["Paralel", "Campuran", "Seri", "Terbuka"], correct: 2 },
                    { q: "Keuntungan rangkaian paralel pada instalasi rumah adalah...", options: ["Lebih hemat kabel", "Jika satu mati, yang lain tetap menyala", "Arus lebih kecil", "Nyala redup"], correct: 1 },
                    { q: "Benda yang dapat menghantarkan arus listrik dengan baik disebut...", options: ["Isolator", "Konduktor", "Radiator", "Adaptor"], correct: 1 },
                    { q: "Contoh bahan isolator listrik yang baik adalah...", options: ["Besi dan Tembaga", "Emas dan Perak", "Karet dan Plastik", "Air dan Aluminium"], correct: 2 },
                    { q: "Sumber energi listrik portabel yang biasa digunakan pada senter adalah...", options: ["Aki", "Dinamo", "Generator", "Baterai"], correct: 3 }
                ]
            },
            {
                id: 3,
                name: "Zona 3: Labirin Kemerdekaan",
                themeClass: "theme-z3",
                bossName: "Jenderal Waktu",
                enemySprite: "M12,20A8,8 0 1,0 4,12A8,8 0 0,0 12,20M12,22A10,10 0 1,1 22,12A10,10 0 0,1 12,22M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z",
                enemyColor: "#ef4444",
                maxPlayerHp: 200, maxEnemyHp: 200,
                dmgPlayer: 40, dmgEnemy: 40, // 5 hits
                questions: [
                    { q: "Tokoh yang mengetik teks proklamasi kemerdekaan Indonesia adalah...", options: ["Ir. Soekarno", "Sayuti Melik", "Sutan Syahrir", "Fatmawati"], correct: 1 },
                    { q: "ASEAN didirikan pada tanggal 8 Agustus 1967 berdasarkan...", options: ["Deklarasi Bandung", "Perjanjian Linggarjati", "Deklarasi Bangkok", "Piagam Jakarta"], correct: 2 },
                    { q: "Satu-satunya negara di ASEAN yang tidak pernah dijajah bangsa Eropa adalah...", options: ["Filipina", "Malaysia", "Singapura", "Thailand"], correct: 3 },
                    { q: "Ibu Fatmawati memiliki peran penting dalam proklamasi kemerdekaan, yaitu...", options: ["Membaca naskah", "Mengetik teks", "Menjahit Bendera Pusaka", "Menjaga Soekarno"], correct: 2 },
                    { q: "Negara anggota ASEAN yang dijuluki sebagai 'Negara Gajah Putih' adalah...", options: ["Thailand", "Myanmar", "Vietnam", "Laos"], correct: 0 }
                ]
            },
            {
                id: 4,
                name: "Zona 4: Observatorium Astral",
                themeClass: "theme-z4",
                bossName: "Penguasa Meteor",
                enemySprite: "M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z",
                enemyColor: "#c084fc",
                maxPlayerHp: 250, maxEnemyHp: 250,
                dmgPlayer: 50, dmgEnemy: 50, // 5 hits
                questions: [
                    { q: "Pusat tata surya kita adalah...", options: ["Bumi", "Bulan", "Matahari", "Jupiter"], correct: 2 },
                    { q: "Planet terbesar dalam tata surya kita adalah...", options: ["Mars", "Saturnus", "Uranus", "Jupiter"], correct: 3 },
                    { q: "Perputaran bumi pada porosnya yang menyebabkan terjadinya siang dan malam disebut...", options: ["Revolusi", "Rotasi", "Gravitasi", "Orbit"], correct: 1 },
                    { q: "Gerhana matahari terjadi ketika posisi benda langit berada pada satu garis lurus, yaitu...", options: ["Matahari - Bumi - Bulan", "Matahari - Bulan - Bumi", "Bumi - Matahari - Bulan", "Bulan - Matahari - Bumi"], correct: 1 },
                    { q: "Planet yang dijuluki sebagai 'Planet Merah' adalah...", options: ["Venus", "Mars", "Merkurius", "Neptunus"], correct: 1 }
                ]
            }
        ];

        // --- GLOBAL STATE ---
        let currentZoneIndex = 0;
        let unlockedZoneID = parseInt(localStorage.getItem('guardian_unlocked_zone')) || 1;
        let pHP = 0; let eHP = 0;
        let currentQIndex = 0;
        let isProcessing = false;
        let activeQuestions = [];

        // DOM Elements
        const DOM = {
            body: document.body,
            headerSub: document.getElementById('header-subtitle'),
            scrMenu: document.getElementById('screen-menu'),
            scrMap: document.getElementById('screen-map'),
            scrBattle: document.getElementById('screen-battle'),
            scrResult: document.getElementById('screen-result'),
            mapContainer: document.getElementById('map-container'),
            pFill: document.getElementById('ui-player-hp-fill'),
            pTxt: document.getElementById('ui-player-hp-txt'),
            eFill: document.getElementById('ui-enemy-hp-fill'),
            eTxt: document.getElementById('ui-enemy-hp-txt'),
            eName: document.getElementById('ui-enemy-name'),
            pSprite: document.getElementById('sprite-player'),
            eSprite: document.getElementById('sprite-enemy'),
            eSpritePath: document.getElementById('sprite-enemy-path'),
            log: document.getElementById('ui-log'),
            qText: document.getElementById('ui-question'),
            btns: [
                document.getElementById('btn-opt-0'),
                document.getElementById('btn-opt-1'),
                document.getElementById('btn-opt-2'),
                document.getElementById('btn-opt-3')
            ],
            resTitle: document.getElementById('result-title'),
            resMsg: document.getElementById('result-msg'),
            resBtns: document.getElementById('result-buttons')
        };

        // --- CORE FUNCTIONS ---

        function showScreen(screenId) {
            DOM.scrMenu.classList.add('hidden');
            DOM.scrMap.classList.add('hidden');
            DOM.scrBattle.classList.add('hidden');
            DOM.scrResult.classList.add('hidden');
            
            document.getElementById(screenId).classList.remove('hidden');

            if (screenId === 'screen-map') renderMap();
            if (screenId === 'screen-menu') DOM.body.className = ''; // Reset theme
        }

        function renderMap() {
            DOM.body.className = ''; // Default theme for map
            DOM.headerSub.textContent = "Pilih Dimensi Tujuan";
            DOM.mapContainer.innerHTML = '';

            ZONES.forEach((zone, index) => {
                const isUnlocked = zone.id <= unlockedZoneID;
                const isCompleted = zone.id < unlockedZoneID;
                
                const node = document.createElement('div');
                node.className = `map-node p-4 md:p-6 rounded-lg text-center flex flex-col items-center justify-center min-h-[120px] ${isUnlocked ? 'unlocked' : 'opacity-50'} ${isCompleted ? 'completed' : ''}`;
                
                if (isUnlocked) {
                    node.onclick = () => startBattle(index);
                }

                node.innerHTML = `
                    <div class="text-xl mb-2">${isCompleted ? '⭐' : (isUnlocked ? '⚔️' : '🔒')}</div>
                    <div class="text-[10px] md:text-xs font-bold leading-relaxed">${zone.name}</div>
                    ${isUnlocked ? `<div class="text-[8px] mt-2 text-gray-400">Boss: ${zone.bossName}</div>` : ''}
                `;
                DOM.mapContainer.appendChild(node);
            });
        }

        function startBattle(zoneIndex) {
            currentZoneIndex = zoneIndex;
            const zone = ZONES[currentZoneIndex];
            
            // Setup Theme
            DOM.body.className = zone.themeClass;
            DOM.headerSub.textContent = zone.name;

            // Setup Stats
            pHP = zone.maxPlayerHp;
            eHP = zone.maxEnemyHp;
            
            // Setup Enemy Visuals
            DOM.eName.textContent = zone.bossName;
            DOM.eSpritePath.setAttribute('d', zone.enemySprite);
            DOM.eSprite.style.color = zone.enemyColor;

            // Setup Questions (clone and shuffle)
            activeQuestions = [...zone.questions].sort(() => Math.random() - 0.5);
            currentQIndex = 0;

            updateHPBars();
            DOM.log.innerHTML = `Awas! <span style="color:${zone.enemyColor}">${zone.bossName}</span> muncul!`;
            
            showScreen('screen-battle');
            loadQuestion();
        }

        function updateHPBars() {
            const z = ZONES[currentZoneIndex];
            const dp = Math.max(0, pHP);
            const de = Math.max(0, eHP);

            DOM.pTxt.textContent = `${dp}/${z.maxPlayerHp}`;
            DOM.pFill.style.width = `${(dp / z.maxPlayerHp) * 100}%`;
            
            DOM.eTxt.textContent = `${de}/${z.maxEnemyHp}`;
            DOM.eFill.style.width = `${(de / z.maxEnemyHp) * 100}%`;
        }

        function loadQuestion() {
            DOM.btns.forEach(btn => {
                btn.className = "btn-game text-[9px] md:text-[10px] p-3 rounded";
                btn.disabled = false;
            });

            if (currentQIndex >= activeQuestions.length) {
                activeQuestions.sort(() => Math.random() - 0.5);
                currentQIndex = 0;
            }

            const q = activeQuestions[currentQIndex];
            DOM.qText.textContent = q.q;
            q.options.forEach((opt, idx) => {
                DOM.btns[idx].textContent = opt;
            });

            isProcessing = false;
        }

        function handleAnswer(idx) {
            if (isProcessing) return;
            isProcessing = true;

            DOM.btns.forEach(btn => btn.disabled = true);

            const q = activeQuestions[currentQIndex];
            const chosen = DOM.btns[idx];

            if (idx === q.correct) {
                chosen.classList.add('correct-btn');
                playerAttack();
            } else {
                chosen.classList.add('wrong-btn');
                DOM.btns[q.correct].classList.add('correct-btn');
                enemyAttack();
            }
        }

        function playerAttack() {
            const z = ZONES[currentZoneIndex];
            DOM.log.innerHTML = `<span class="text-green-400">Tepat Sekali!</span> Kamu melancarkan serangan logika!`;
            DOM.pSprite.classList.add('attack-player-anim');
            
            setTimeout(() => {
                eHP -= z.dmgPlayer;
                updateHPBars();
                DOM.eSprite.classList.add('shake-anim');
                
                setTimeout(() => {
                    DOM.pSprite.classList.remove('attack-player-anim');
                    DOM.eSprite.classList.remove('shake-anim');
                    checkWinLoss();
                }, 400);
            }, 150);
        }

        function enemyAttack() {
            const z = ZONES[currentZoneIndex];
            DOM.log.innerHTML = `<span class="text-red-400">Salah!</span> ${z.bossName} membalas serangan!`;
            DOM.eSprite.classList.add('attack-enemy-anim');
            
            setTimeout(() => {
                pHP -= z.dmgEnemy;
                updateHPBars();
                DOM.pSprite.classList.add('shake-anim');
                
                setTimeout(() => {
                    DOM.eSprite.classList.remove('attack-enemy-anim');
                    DOM.pSprite.classList.remove('shake-anim');
                    checkWinLoss();
                }, 400);
            }, 150);
        }

        function checkWinLoss() {
            if (eHP <= 0) {
                setTimeout(() => endGame(true), 1000);
            } else if (pHP <= 0) {
                setTimeout(() => endGame(false), 1000);
            } else {
                setTimeout(() => {
                    DOM.log.textContent = "Bersiap untuk pertanyaan selanjutnya...";
                    currentQIndex++;
                    loadQuestion();
                }, 1200);
            }
        }

        function endGame(isWin) {
            const z = ZONES[currentZoneIndex];
            showScreen('screen-result');

            if (isWin) {
                DOM.resTitle.textContent = "ZONA DITAKLUKKAN!";
                DOM.resTitle.className = "text-2xl md:text-3xl mb-4 text-green-400 drop-shadow-[0_0_10px_rgba(74,222,128,0.8)]";
                DOM.resMsg.textContent = `Hebat! Kamu berhasil mengalahkan ${z.bossName} dan memulihkan pecahan kristal zona ini.`;
                
                // Unlock next zone logic
                if (z.id >= unlockedZoneID && z.id < ZONES.length) {
                    unlockedZoneID = z.id + 1;
                    localStorage.setItem('guardian_unlocked_zone', unlockedZoneID);
                } else if (z.id === ZONES.length) {
                    DOM.resMsg.textContent = "LUAR BIASA! KAMU TELAH MENAKLUKKAN SEMUA ZONA DAN MENJADI GUARDIAN SEJATI!";
                }

                DOM.resBtns.innerHTML = `<button onclick="showScreen('screen-map')" class="btn-game px-6 py-3 rounded">Peta Dimensi</button>`;
            } else {
                DOM.resTitle.textContent = "KAMU TERKALAHKAN";
                DOM.resTitle.className = "text-2xl md:text-3xl mb-4 text-red-500 drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]";
                DOM.resMsg.textContent = `Energimu habis terkena serangan ${z.bossName}. Jangan menyerah, pelajari materinya lagi!`;
                
                DOM.resBtns.innerHTML = `
                    <button onclick="startBattle(${currentZoneIndex})" class="btn-game px-6 py-3 rounded">Coba Lagi</button>
                    <button onclick="showScreen('screen-map')" class="btn-game px-6 py-3 rounded border-gray-500 text-gray-400">Kembali ke Peta</button>
                `;
            }
        }

        function resetProgress() {
            if(confirm("Hapus semua progres dan kunci zona?")) {
                localStorage.removeItem('guardian_unlocked_zone');
                unlockedZoneID = 1;
                alert("Progres di-reset.");
                showScreen('screen-menu');
            }
        }

    </script>
</body>
</html>
